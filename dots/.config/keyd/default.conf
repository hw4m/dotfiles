[ids]
*

[main]

# Capslock switches to the 'dk' layer
capslock = layer(caps-layer)

[caps-layer]
# lowercase æøå
' = macro(compose a e)
o = macro(compose o /)
a = macro(compose a a)

# Uppercase ÆØÅ
shift-' = macro(compose A E)
shift-o = macro(compose O /) # Doesn't work yet, needs to be fixed
shift-a = macro(compose A A)

## Emails
d = macro(danny@hvam.io)

## Simplify complicated shortcut keys
v = C-S-v
x = A-f4
s = command(systemctl suspend)

# Claria
q = macro(1234567)
1 = macro(single@hvam.io)
2 = macro(couple@hvam.io)
3 = macro(test03@hvam.io)
4 = macro(test04@hvam.io)

5 = macro(single@hvam.io tab 1234567 enter)
6 = macro(couple@hvam.io tab 1234567 enter)
7 = macro(test03@hvam.io tab 1234567 enter)
8 = macro(test04@hvam.io tab 1234567 enter)
